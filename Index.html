<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>ЗМЕЙКА — барада.маркет</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#00ff88"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ЗМЕЙКА"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

:root{
  --bg:#0a0a0f;
  --grid:#0d1117;
  --border:#1a2040;
  --accent:#00ff88;
  --accent2:#00ccff;
  --red:#ff3355;
  --yellow:#ffcc00;
  --purple:#bb00ff;
  --text:#e0e8ff;
  --pixel:4px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;background:var(--bg);color:var(--text);
  font-family:'Press Start 2P',monospace;
  overflow:hidden;user-select:none;
}

/* Scanlines overlay */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);
}

/* CRT glow on body */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:998;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,50,.5) 100%);
}

#game-wrap{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:12px;padding:12px;position:relative;
}

/* ── HEADER ── */
.hdr{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:420px}
.logo-txt{font-size:10px;color:var(--accent);text-shadow:0 0 10px var(--accent);letter-spacing:2px}
.score-box{
  background:var(--grid);border:2px solid var(--accent);
  padding:6px 12px;font-size:9px;
  box-shadow:0 0 12px rgba(0,255,136,.3),inset 0 0 8px rgba(0,255,136,.05);
  image-rendering:pixelated;
}
.score-label{color:var(--accent2);font-size:7px;margin-bottom:3px}
.score-val{color:var(--accent);font-size:14px;text-shadow:0 0 8px var(--accent)}

/* ── CANVAS WRAPPER ── */
.canvas-wrap{
  position:relative;
  border:3px solid var(--accent);
  box-shadow:
    0 0 0 1px #000,
    0 0 20px rgba(0,255,136,.4),
    0 0 60px rgba(0,255,136,.15),
    inset 0 0 30px rgba(0,0,20,.8);
  image-rendering:pixelated;
}
canvas{display:block;image-rendering:pixelated;background:var(--grid);}

/* Pixel corner decorations */
.canvas-wrap::before,.canvas-wrap::after{
  content:'';position:absolute;width:12px;height:12px;border-color:var(--accent2);border-style:solid;
  box-shadow:0 0 8px var(--accent2);
}
.canvas-wrap::before{top:-3px;left:-3px;border-width:3px 0 0 3px}
.canvas-wrap::after{bottom:-3px;right:-3px;border-width:0 3px 3px 0}

/* ── STATS ROW ── */
.stats{display:flex;gap:16px;width:100%;max-width:420px;justify-content:center}
.stat-box{
  background:var(--grid);border:2px solid var(--border);
  padding:5px 10px;font-size:7px;text-align:center;flex:1;max-width:110px;
}
.stat-label{color:var(--text2,#556);margin-bottom:3px}
.stat-val{color:var(--accent2);font-size:10px}

/* ── D-PAD (mobile) ── */
.dpad{
  display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;
  gap:4px;margin-top:4px;
}
.dpad-btn{
  background:var(--grid);border:2px solid var(--border);
  border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:18px;cursor:pointer;transition:.1s;touch-action:none;
  box-shadow:0 4px 0 #080810,0 0 8px rgba(0,204,255,.15);
  position:relative;top:0;
}
.dpad-btn:active{top:3px;box-shadow:0 1px 0 #080810}
.dpad-btn.up{grid-column:2;grid-row:1}
.dpad-btn.left{grid-column:1;grid-row:2}
.dpad-btn.center{grid-column:2;grid-row:2;font-size:10px;color:var(--accent);border-color:var(--accent);
  box-shadow:0 4px 0 rgba(0,255,136,.3),0 0 12px rgba(0,255,136,.2)}
.dpad-btn.right{grid-column:3;grid-row:2}
.dpad-btn.down{grid-column:2;grid-row:3}

/* ── OVERLAY ── */
.overlay{
  position:absolute;inset:0;background:rgba(0,0,10,.88);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;z-index:10;
}
.overlay-title{
  font-size:18px;text-align:center;
  animation:blink 1s step-end infinite;
}
.overlay-title.green{color:var(--accent);text-shadow:0 0 20px var(--accent)}
.overlay-title.red{color:var(--red);text-shadow:0 0 20px var(--red)}
.overlay-sub{font-size:8px;color:var(--accent2);text-align:center;line-height:2;opacity:.8}
.overlay-score{font-size:11px;color:var(--yellow);text-shadow:0 0 10px var(--yellow);margin:4px 0}
.overlay-record{font-size:8px;color:var(--purple);text-shadow:0 0 8px var(--purple)}
.start-hint{font-size:8px;color:var(--accent);animation:blink .8s step-end infinite;margin-top:8px}

/* ── LEVEL UP FLASH ── */
.level-flash{
  position:absolute;inset:0;background:rgba(0,255,136,.08);
  pointer-events:none;z-index:5;opacity:0;
  animation:none;
}
.level-flash.show{animation:flashIn .4s ease-out forwards}
@keyframes flashIn{0%{opacity:1}100%{opacity:0}}

@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── HIGH SCORE BADGE ── */
.hs-badge{
  position:absolute;top:-1px;right:8px;
  background:var(--yellow);color:#000;font-size:6px;padding:2px 5px;
  transform:translateY(-100%);
}

/* ── PIXEL FONT SIZES ── */
@media(max-height:700px){
  .dpad-btn{width:44px;height:44px;font-size:15px}
  .dpad{grid-template-columns:44px 44px 44px;grid-template-rows:44px 44px 44px}
}
</style>
</head>
<body>

<div id="game-wrap">
  <div class="hdr">
    <div class="logo-txt">🐍 ЗМЕЙКА</div>
    <div class="score-box">
      <div class="score-label">ОЧКИ</div>
      <div class="score-val" id="score-display">000</div>
    </div>
  </div>

  <div class="canvas-wrap" id="canvas-wrap">
    <canvas id="c"></canvas>
    <div class="level-flash" id="level-flash"></div>
    <div class="overlay" id="overlay">
      <div class="overlay-title green" id="ov-title">ЗМЕЙКА</div>
      <div class="overlay-sub" id="ov-sub">СТРЕЛКИ / СВАЙП<br>ДЛЯ УПРАВЛЕНИЯ</div>
      <div class="overlay-score" id="ov-score" style="display:none"></div>
      <div class="overlay-record" id="ov-record" style="display:none"></div>
      <div class="start-hint" id="ov-hint">[ НАЖМИ ЧТОБЫ НАЧАТЬ ]</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-label">РЕКОРД</div>
      <div class="stat-val" id="best-display">000</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">УРОВЕНЬ</div>
      <div class="stat-val" id="level-display">1</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">СКОРОСТЬ</div>
      <div class="stat-val" id="speed-display">★☆☆☆☆</div>
    </div>
  </div>

  <div class="dpad" id="dpad">
    <button class="dpad-btn up"    id="btn-up"    ontouchstart="padPress('U')" onmousedown="padPress('U')">▲</button>
    <button class="dpad-btn left"  id="btn-left"  ontouchstart="padPress('L')" onmousedown="padPress('L')">◄</button>
    <button class="dpad-btn center"               ontouchstart="togglePause()" onmousedown="togglePause()">⏸</button>
    <button class="dpad-btn right" id="btn-right" ontouchstart="padPress('R')" onmousedown="padPress('R')">►</button>
    <button class="dpad-btn down"  id="btn-down"  ontouchstart="padPress('D')" onmousedown="padPress('D')">▼</button>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────
const CELL = 16; // px per grid cell
const COLS = 20;
const ROWS = 20;

// Colors
const C = {
  bg:      '#0d1117',
  grid:    '#0f1520',
  snakeH:  '#00ff88',
  snakeB:  '#00cc66',
  snakeD:  '#009944',
  food:    '#ff3355',
  foodGlow:'#ff0033',
  bonus:   '#ffcc00',
  bonusGl: '#ff9900',
  wall:    '#1a3a60',
  wallB:   '#0d2040',
  score:   '#00ff88',
  text:    '#e0e8ff',
};

// ── STATE ─────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
canvas.width  = COLS * CELL;
canvas.height = ROWS * CELL;

let snake, dir, nextDir, food, bonus, bonusTimer;
let score, best, level, speed, gameState, paused;
let foodAnim = 0, tick = 0, deathIdx = 0;
let loopId = null;

const SPEEDS = [180, 150, 120, 95, 75, 58, 44, 32]; // ms per tick

// ── INIT ──────────────────────────────────────────────
function init(){
  snake    = [{x:10,y:10},{x:9,y:10},{x:8,y:10},{x:7,y:10}];
  dir      = {x:1,y:0};
  nextDir  = {x:1,y:0};
  food     = randomFood();
  bonus    = null; bonusTimer = 0;
  score    = 0; level = 1; speed = 0;
  paused   = false; tick = 0; deathIdx = 0;
  best     = +localStorage.getItem('snake_best')||0;
  gameState= 'playing';
  updateHUD();
  if(loopId) clearTimeout(loopId);
  loop();
}

function randomFood(){
  let pos;
  do{ pos={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}; }
  while(snake.some(s=>s.x===pos.x&&s.y===pos.y));
  return pos;
}

// ── MAIN LOOP ─────────────────────────────────────────
function loop(){
  if(gameState!=='playing'||paused) return;
  const delay = SPEEDS[Math.min(speed, SPEEDS.length-1)];
  loopId = setTimeout(()=>{
    update();
    draw();
    loop();
  }, delay);
}

function update(){
  tick++;

  // Bonus spawn every 5 foods
  if(bonus && bonusTimer>0){
    bonusTimer--;
    if(bonusTimer===0) bonus=null;
  }

  foodAnim = (foodAnim + 1) % 20;

  dir = {...nextDir};
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // Wall wrap
  head.x = (head.x + COLS) % COLS;
  head.y = (head.y + ROWS) % ROWS;

  // Self collision
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){
    gameState='dead'; draw(); showDead(); return;
  }

  snake.unshift(head);

  let ate = false;
  if(head.x===food.x && head.y===food.y){
    ate = true;
    score += level * 10;
    food = randomFood();
    // Level up every 5 foods
    if(score>0 && (score / (level*10)) % 5 === 0){
      level = Math.min(level+1, 8);
      speed = Math.min(speed+1, SPEEDS.length-1);
      showLevelFlash();
    }
    // Bonus appears every 5 food items
    if(Math.random()<0.4 && !bonus){
      bonus = randomFood();
      bonusTimer = 60 + Math.floor(Math.random()*60);
    }
    if(score>best){ best=score; localStorage.setItem('snake_best',best); }
    updateHUD();
  }
  if(bonus && head.x===bonus.x && head.y===bonus.y){
    ate = true;
    score += level * 50;
    bonus = null;
    if(score>best){ best=score; localStorage.setItem('snake_best',best); }
    updateHUD();
  }
  if(!ate) snake.pop();
}

// ── DRAW ──────────────────────────────────────────────
function draw(){
  ctx.fillStyle = C.bg;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Grid dots
  ctx.fillStyle = C.grid;
  for(let x=0;x<COLS;x++) for(let y=0;y<ROWS;y++){
    ctx.fillRect(x*CELL+CELL/2-1, y*CELL+CELL/2-1, 2, 2);
  }

  // Food
  drawFood();

  // Bonus
  if(bonus) drawBonus();

  // Snake
  drawSnake();

  // Dead animation overlay
  if(gameState==='dead') drawDeathFlash();
}

function drawFood(){
  const x = food.x*CELL, y = food.y*CELL;
  const pulse = Math.sin(foodAnim/20*Math.PI*2)*2;
  const s = CELL - 4 + pulse;
  const off = (CELL - s) / 2;

  // Glow
  ctx.save();
  ctx.shadowColor = C.foodGlow;
  ctx.shadowBlur = 12 + pulse;
  ctx.fillStyle = C.food;
  // Pixel apple shape
  pixelRect(ctx, x+off, y+off, s, s, C.food);
  // Highlight
  pixelRect(ctx, x+off, y+off, 3, 3, 'rgba(255,255,255,0.5)');
  ctx.restore();

  // Stem
  ctx.fillStyle = '#00cc44';
  ctx.fillRect(x+CELL/2-1, y+2, 2, 3);
}

function drawBonus(){
  const x = bonus.x*CELL, y = bonus.y*CELL;
  const pulse = Math.sin(tick/5)*3;
  const s = CELL - 2 + pulse;
  const off = (CELL-s)/2;

  ctx.save();
  ctx.shadowColor = C.bonusGl;
  ctx.shadowBlur = 16 + pulse;
  // Star-ish shape (diamond)
  ctx.fillStyle = C.bonus;
  ctx.beginPath();
  ctx.moveTo(x+CELL/2, y+off);
  ctx.lineTo(x+CELL-off, y+CELL/2);
  ctx.lineTo(x+CELL/2, y+CELL-off);
  ctx.lineTo(x+off, y+CELL/2);
  ctx.closePath();
  ctx.fill();
  // Inner highlight
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath();
  ctx.moveTo(x+CELL/2, y+off+3);
  ctx.lineTo(x+CELL-off-3, y+CELL/2);
  ctx.lineTo(x+CELL/2, y+CELL/2);
  ctx.lineTo(x+off+3, y+CELL/2);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Timer bar
  const pct = bonusTimer / 120;
  ctx.fillStyle = 'rgba(255,204,0,.3)';
  ctx.fillRect(bonus.x*CELL, bonus.y*CELL+CELL-3, CELL, 3);
  ctx.fillStyle = C.bonus;
  ctx.fillRect(bonus.x*CELL, bonus.y*CELL+CELL-3, CELL*pct, 3);
}

function drawSnake(){
  for(let i=snake.length-1;i>=0;i--){
    const seg = snake[i];
    const x = seg.x*CELL, y = seg.y*CELL;
    const isHead = i===0;
    const isTail = i===snake.length-1;

    if(isHead){
      ctx.save();
      ctx.shadowColor = C.snakeH;
      ctx.shadowBlur = 10;
      ctx.fillStyle = C.snakeH;
      ctx.fillRect(x+1, y+1, CELL-2, CELL-2);
      // Eyes
      ctx.fillStyle = '#001a0a';
      const eyeSize = 2;
      let e1x=x+4, e1y=y+4, e2x=x+CELL-6, e2y=y+4;
      if(dir.x===1){e1x=x+CELL-5;e1y=y+4;e2x=x+CELL-5;e2y=y+CELL-6;}
      else if(dir.x===-1){e1x=x+3;e1y=y+4;e2x=x+3;e2y=y+CELL-6;}
      else if(dir.y===-1){e1x=x+4;e1y=y+3;e2x=x+CELL-6;e2y=y+3;}
      ctx.fillRect(e1x,e1y,eyeSize,eyeSize);
      ctx.fillRect(e2x,e2y,eyeSize,eyeSize);
      // Tongue flicker
      if(tick%10<5){
        ctx.fillStyle='#ff3355';
        if(dir.x===1){ctx.fillRect(x+CELL,y+CELL/2-1,3,1);ctx.fillRect(x+CELL+2,y+CELL/2-2,1,1);ctx.fillRect(x+CELL+2,y+CELL/2,1,1);}
        else if(dir.x===-1){ctx.fillRect(x-3,y+CELL/2-1,3,1);ctx.fillRect(x-3,y+CELL/2-2,1,1);ctx.fillRect(x-3,y+CELL/2,1,1);}
        else if(dir.y===-1){ctx.fillRect(x+CELL/2-1,y-3,1,3);ctx.fillRect(x+CELL/2-2,y-3,1,1);ctx.fillRect(x+CELL/2,y-3,1,1);}
        else{ctx.fillRect(x+CELL/2-1,y+CELL,1,3);ctx.fillRect(x+CELL/2-2,y+CELL+2,1,1);ctx.fillRect(x+CELL/2,y+CELL+2,1,1);}
      }
      ctx.restore();
    } else {
      // Body segments — checker pattern
      const shade = i%2===0 ? C.snakeB : C.snakeD;
      ctx.fillStyle = shade;
      ctx.fillRect(x+2, y+2, CELL-4, CELL-4);
      // Shine
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fillRect(x+2, y+2, CELL-4, 2);
    }
  }
}

function pixelRect(ctx,x,y,w,h,color){
  ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
}

function drawDeathFlash(){
  deathIdx++;
  if(deathIdx%4<2){
    ctx.fillStyle='rgba(255,51,85,0.08)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  // Highlight dead snake red
  for(const seg of snake){
    ctx.fillStyle=`rgba(255,51,85,${0.3+Math.sin(deathIdx/3)*0.2})`;
    ctx.fillRect(seg.x*CELL+1,seg.y*CELL+1,CELL-2,CELL-2);
  }
}

// ── HUD ───────────────────────────────────────────────
function updateHUD(){
  const fmt = n=>String(n).padStart(3,'0');
  document.getElementById('score-display').textContent = fmt(score);
  document.getElementById('best-display').textContent  = fmt(best);
  document.getElementById('level-display').textContent = level;
  const stars = '★'.repeat(speed+1)+'☆'.repeat(Math.max(0,5-speed-1));
  document.getElementById('speed-display').textContent = stars;
}

function showLevelFlash(){
  const f = document.getElementById('level-flash');
  f.classList.remove('show');
  void f.offsetWidth;
  f.classList.add('show');
}

// ── OVERLAY ───────────────────────────────────────────
function showOverlay(title, titleClass, sub, scoreVal, recordVal, hint){
  const ov = document.getElementById('overlay');
  document.getElementById('ov-title').textContent = title;
  document.getElementById('ov-title').className = 'overlay-title '+titleClass;
  document.getElementById('ov-sub').innerHTML = sub;
  const sc = document.getElementById('ov-score');
  const rc = document.getElementById('ov-record');
  if(scoreVal){sc.style.display='';sc.textContent='ОЧКИ: '+scoreVal;}else sc.style.display='none';
  if(recordVal){rc.style.display='';rc.textContent='🏆 РЕКОРД: '+recordVal;}else rc.style.display='none';
  document.getElementById('ov-hint').textContent = hint;
  ov.style.display='flex';
}
function hideOverlay(){ document.getElementById('overlay').style.display='none'; }

function showDead(){
  if(loopId) clearTimeout(loopId);
  // Flash red a few times then show overlay
  let flashes = 0;
  const fi = setInterval(()=>{
    draw();
    flashes++;
    if(flashes>12){ clearInterval(fi);
      showOverlay('КОНЕЦ!','red',
        'УДАРИЛСЯ О СЕБЯ',
        String(score).padStart(3,'0'),
        score>=best?'🎉 НОВЫЙ РЕКОРД!':'РЕКОРД: '+String(best).padStart(3,'0'),
        '[ TAP ЧТОБЫ НАЧАТЬ СНОВА ]'
      );
      gameState='over';
    }
  },50);
}

// ── INPUT ─────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(gameState==='start'||gameState==='over'){ startGame(); return; }
  if(e.code==='Space'||e.code==='Escape'){ togglePause(); return; }
  const map={'ArrowUp':'U','ArrowDown':'D','ArrowLeft':'L','ArrowRight':'R',
             'KeyW':'U','KeyS':'D','KeyA':'L','KeyD':'R'};
  if(map[e.code]) { e.preventDefault(); setDir(map[e.code]); }
});

function setDir(d){
  if(gameState!=='playing'||paused) return;
  const moves={U:{x:0,y:-1},D:{x:0,y:1},L:{x:-1,y:0},R:{x:1,y:0}};
  const nd=moves[d];
  // Prevent reversing
  if(nd.x===-dir.x&&nd.y===-dir.y) return;
  nextDir=nd;
}

function padPress(d){
  if(gameState==='start'||gameState==='over'){ startGame(); return; }
  setDir(d);
}

function togglePause(){
  if(gameState==='start'||gameState==='over'){ startGame(); return; }
  if(gameState!=='playing') return;
  paused=!paused;
  if(!paused){
    hideOverlay(); loop();
  } else {
    if(loopId) clearTimeout(loopId);
    showOverlay('ПАУЗА','green','','','','[ TAP ДЛЯ ПРОДОЛЖЕНИЯ ]');
  }
}

// Tap canvas to start/restart
document.getElementById('canvas-wrap').addEventListener('click',()=>{
  if(gameState==='start'||gameState==='over') startGame();
  else if(paused) togglePause();
});

// ── SWIPE ─────────────────────────────────────────────
let touchX=0,touchY=0;
canvas.addEventListener('touchstart',e=>{
  touchX=e.touches[0].clientX; touchY=e.touches[0].clientY;
},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(gameState==='start'||gameState==='over'){ startGame(); return; }
  const dx=e.changedTouches[0].clientX-touchX;
  const dy=e.changedTouches[0].clientY-touchY;
  if(Math.abs(dx)<10&&Math.abs(dy)<10) return;
  if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?'R':'L');
  else setDir(dy>0?'D':'U');
},{passive:true});

// ── START ─────────────────────────────────────────────
function startGame(){
  hideOverlay();
  init();
}

// ── SERVICE WORKER ────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(console.warn);
}

// Initial screen
gameState='start';
best = +localStorage.getItem('snake_best')||0;
updateHUD();
draw();
showOverlay('ЗМЕЙКА','green',
  'СТРЕЛКИ / WASD / СВАЙП<br>ПРОБЕЛ — ПАУЗА',
  null,
  best>0?'РЕКОРД: '+String(best).padStart(3,'0'):null,
  '[ НАЖМИ ДЛЯ СТАРТА ]'
);
</script>
</body>
</html>
